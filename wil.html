<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}
/* Layout: une colonne de lecture au Natel, barre d'onglets fixe en bas ; sur grand écran, colonne centrée de 720px */
:root{
  --bg:#eef1ec; --surface:#ffffff; --ink:#1b211c; --muted:#5b665e; --line:#d5ded6; --tint:#f1f5f1;
  --accent:#1f5230; --accent2:#2c6f41; --gold:#9a6a1c; --red:#a3242f; --amber:#a45f00;
  --display:"Spectral",Georgia,"Times New Roman",serif; --body:"Source Sans 3",system-ui,-apple-system,"Segoe UI",sans-serif;
  --navh:62px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#121613;--surface:#1b211d;--ink:#e8eee9;--muted:#9eab9f;--line:#2e3a31;--tint:#212a23;--accent:#8fc79f;--accent2:#7fbf91;--gold:#d9b06a;--red:#ef8f97;--amber:#f0b45a;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#121613;--surface:#1b211d;--ink:#e8eee9;--muted:#9eab9f;--line:#2e3a31;--tint:#212a23;--accent:#8fc79f;--accent2:#7fbf91;--gold:#d9b06a;--red:#ef8f97;--amber:#f0b45a;color-scheme:dark}
*{box-sizing:border-box}
html,body{background:var(--bg)}
body{color:var(--ink);font:16px/1.45 var(--body);-webkit-text-size-adjust:100%}
.wrap{max-width:720px;margin:0 auto;padding-block:12px calc(var(--navh) + 28px + env(safe-area-inset-bottom,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:14px}
h1,h2,h3{font-family:var(--display);text-wrap:balance;margin:0}
h1{font-size:26px;line-height:1.15}
h2{font-size:20px;line-height:1.2}
h3{font:600 12.5px var(--body);letter-spacing:.13em;text-transform:uppercase;color:var(--muted)}
a{color:var(--accent)}
.muted{color:var(--muted)} .small{font-size:14px}
.top{display:flex;align-items:center;gap:12px}
.top img{width:42px;height:42px;border-radius:50%;flex:none;background:#fff;object-fit:cover}
.top .tt{flex:1;min-width:0}
.top .tt b{display:block;font:700 20px/1.1 var(--display)}
.top .tt span{font-size:13px;color:var(--muted)}
.pill{border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:999px;padding:6px 12px;font:600 13px var(--body);cursor:pointer}
.hero{background:var(--accent);color:#fff;border-radius:16px;padding:16px 18px;display:flex;flex-direction:column;gap:6px}
:root[data-theme="dark"] .hero{color:#0f1a12}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .hero{color:#0f1a12}}
.hero small{font:600 12px var(--body);letter-spacing:.14em;text-transform:uppercase;opacity:.85}
.hero .fest{font:700 22px/1.2 var(--display)}
.hero .slots{display:flex;flex-wrap:wrap;gap:6px;margin-top:4px}
.hero .slots span{background:rgba(255,255,255,.16);border-radius:8px;padding:3px 8px;font-size:14px}
.sec{display:flex;flex-direction:column;gap:8px}
.sec-h{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.sec-h a,.linkbtn{font:600 14px var(--body);color:var(--accent);background:none;border:0;padding:0;cursor:pointer;text-decoration:none}
.list{display:flex;flex-direction:column;background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.row{display:flex;gap:12px;align-items:flex-start;padding:12px 14px;border:0;border-top:1px solid var(--line);background:none;color:inherit;font:inherit;text-align:left;width:100%;text-decoration:none}
.row:first-child{border-top:0}
button.row,a.row{cursor:pointer}
button.row:active,a.row:active{background:var(--tint)}
.row .m{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.row .m b{font-weight:600}
.row .m small{color:var(--muted);font-size:14px;overflow-wrap:anywhere}
.row .s{flex:none;display:flex;flex-direction:column;align-items:flex-end;gap:4px;text-align:right}
.date{flex:none;width:46px;text-align:center;line-height:1.05;font-variant-numeric:tabular-nums}
.date b{display:block;font:700 20px var(--display)}
.date span{font-size:11.5px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
.chip{display:inline-block;border-radius:999px;padding:2px 9px;font:600 12.5px var(--body);background:var(--tint);color:var(--muted);white-space:nowrap}
.chip.red{color:var(--red)} .chip.amber{color:var(--amber)} .chip.ok{color:var(--accent)}
.dot{display:inline-block;width:10px;height:10px;border-radius:50%;border:1px solid var(--line);vertical-align:0;margin-right:6px}
.empty{padding:18px 14px;color:var(--muted);font-size:15px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:10px}
.kv{display:grid;grid-template-columns:minmax(90px,34%) 1fr;gap:6px 12px;margin:0}
.kv dt{color:var(--muted);font-size:14px} .kv dd{margin:0;min-width:0;overflow-wrap:anywhere}
.txt{white-space:pre-wrap;overflow-wrap:anywhere}
input[type=search],input[type=text],input[type=password],textarea,select{width:100%;font:16px var(--body);color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:11px 13px}
textarea{min-height:110px;resize:vertical}
input:focus-visible,textarea:focus-visible,select:focus-visible,button:focus-visible,a:focus-visible{outline:3px solid var(--accent2);outline-offset:2px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border-radius:12px;padding:11px 16px;font:600 15px var(--body);border:1px solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer;text-decoration:none}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--bg)}
.btn.sm{padding:6px 11px;font-size:13.5px;border-radius:10px}
.btn.danger{color:var(--red)}
.bar{display:flex;flex-wrap:wrap;gap:8px}
.tabs{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px}
.tabs button{flex:none;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:999px;padding:7px 13px;font:600 14px var(--body);cursor:pointer}
.tabs button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--bg)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px}
.tile{display:flex;flex-direction:column;gap:6px;align-items:flex-start;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px;color:inherit;text-decoration:none;font:inherit;cursor:pointer;text-align:left}
.tile svg{width:26px;height:26px;color:var(--accent)}
.tile b{font:600 16px var(--display)} .tile small{color:var(--muted);font-size:13px}
nav.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:5;background:var(--surface);border-top:1px solid var(--line);display:flex;justify-content:center;padding-bottom:env(safe-area-inset-bottom,0px);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
nav.tabbar a{flex:1;max-width:144px;height:var(--navh);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;color:var(--muted);text-decoration:none;font:600 11.5px var(--body)}
nav.tabbar a[aria-current="page"]{color:var(--accent)}
nav.tabbar svg{width:23px;height:23px}
svg{fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.lock{min-height:100%;display:flex;flex-direction:column;justify-content:center;gap:16px;max-width:420px;margin:0 auto;padding-block:40px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.lock img{width:84px;height:84px;border-radius:50%;background:#fff;object-fit:cover}
.err{color:var(--red);font-size:14px;min-height:1em}
.note{font-size:14px;color:var(--muted);background:var(--surface);border:1px dashed var(--line);border-radius:12px;padding:12px 14px}
.warn{border-color:var(--amber);color:var(--ink)}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(var(--navh) + 16px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-size:15px;z-index:20;max-width:calc(100% - 32px)}
.num{font-variant-numeric:tabular-nums}
.copy{user-select:all;-webkit-user-select:all}
.hl{background:var(--tint);border-radius:6px;padding:0 4px}
@media (prefers-reduced-motion:no-preference){.row,.tile,.btn{transition:background .12s}}

/* (2026-11-07) pas de rechargement du navigateur en tirant vers le bas : l'application actualise elle-même */
html,body{overscroll-behavior-y:none}
#ptr{position:fixed;left:50%;top:calc(env(safe-area-inset-top,0px) + 8px);z-index:60;transform:translate(-50%,-50px);opacity:0;background:var(--surface,#fff);color:var(--accent,#1f5230);border:1px solid rgba(0,0,0,.12);border-radius:999px;padding:8px 16px;font-weight:600;font-size:15px;box-shadow:0 4px 14px rgba(0,0,0,.15);transition:opacity .15s;pointer-events:none;white-space:nowrap}
.pin{-webkit-text-security:disc;text-security:disc;letter-spacing:.2em}

<script>
'use strict';
/* ============ Noyau commun des applications Natel ============
   Le code est en ligne ; les données viennent de fichiers choisis sur le Natel (OneDrive / SharePoint)
   et restent sur ce Natel, chiffrées avec le code de verrouillage. */
const M = (() => {
  const ITER = 210000, AUTOLOCK_MIN = 10;
  let cfg, key = null, st = null, dl = null, memOnly = false, hiddenAt = 0, pendingLien = null, syncing = false, pushing = false;
  let view = { n: 'home', a: null }, stack = [], ui = {};
  const app = () => document.getElementById('app');

  /* ---------- petits outils ---------- */
  const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const pad = n => String(n).padStart(2, '0');
  const iso = d => d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate());
  const today = () => iso(new Date());
  const parse = s => { const [y, m, d] = String(s).slice(0, 10).split('-').map(Number); return new Date(y, (m || 1) - 1, d || 1) };
  const addDays = (s, n) => { const d = parse(s); d.setDate(d.getDate() + n); return iso(d) };
  const diffDays = (a, b) => Math.round((parse(b) - parse(a)) / 864e5);
  const locale = () => (lang() === 'de' ? 'de-CH' : 'fr-CH');
  const fmtD = (s, o) => { if (!s) return ''; try { return parse(s).toLocaleDateString(locale(), o || { day: 'numeric', month: 'numeric', year: 'numeric' }) } catch (e) { return s } };
  const fmtLong = s => fmtD(s, { weekday: 'long', day: 'numeric', month: 'long' });
  const wd = s => fmtD(s, { weekday: 'short' }).replace('.', '');
  const mon = s => fmtD(s, { month: 'short' }).replace('.', '');
  const chf = n => (Math.round((+n || 0) * 100) / 100).toLocaleString('de-CH', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
  const uid = () => Math.random().toString(36).slice(2, 9) + Date.now().toString(36).slice(-4);
  const norm = s => String(s ?? '').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '');
  const LS = { get(k) { try { return localStorage.getItem(k) } catch (e) { return null } }, set(k, v) { try { localStorage.setItem(k, v) } catch (e) { } } };
  function lang() { return cfg.langs.includes(LS.get(cfg.id + '-lang')) ? LS.get(cfg.id + '-lang') : cfg.langs[0] }
  function t(k, p) { const D = cfg.T[lang()] || cfg.T[cfg.langs[0]]; let s = D[k] ?? cfg.T[cfg.langs[0]][k] ?? k; if (p) for (const x in p) s = s.split('{' + x + '}').join(p[x]); return s }
  function toast(msg) { let el = document.getElementById('toast'); if (!el) { el = document.createElement('div'); el.id = 'toast'; el.setAttribute('role', 'status'); document.body.appendChild(el) } el.textContent = msg; el.hidden = false; clearTimeout(toast.t); toast.t = setTimeout(() => el.hidden = true, 2600) }

  /* ---------- chiffrement ---------- */
  const b64 = u8 => { let s = ''; const a = new Uint8Array(u8); for (let i = 0; i < a.length; i += 0x8000) s += String.fromCharCode.apply(null, a.subarray(i, i + 0x8000)); return btoa(s) };
  const unb64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
  async function derive(pw, salt, iter) { const base = await crypto.subtle.importKey('raw', new TextEncoder().encode(pw), 'PBKDF2', false, ['deriveKey']); return crypto.subtle.deriveKey({ name: 'PBKDF2', salt, iterations: iter || ITER, hash: 'SHA-256' }, base, { name: 'AES-GCM', length: 256 }, false, ['encrypt', 'decrypt']) }
  async function enc(obj, k) { const iv = crypto.getRandomValues(new Uint8Array(12)); const ct = await crypto.subtle.encrypt({ name: 'AES-GCM', iv }, k, new TextEncoder().encode(JSON.stringify(obj))); return { iv: b64(iv), ct: b64(ct) } }
  async function dec(o, k) { const pt = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: unb64(o.iv) }, k, unb64(o.ct)); return JSON.parse(new TextDecoder().decode(pt)) }

  /* ---------- stockage local (IndexedDB) ---------- */
  let dbp = null, docsMem = null;
  function idb() { if (!dbp) dbp = new Promise((res, rej) => { try { const r = indexedDB.open('natel-' + cfg.id, 1); r.onupgradeneeded = () => r.result.createObjectStore('kv'); r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error) } catch (e) { rej(e) } }); return dbp }
  async function kvGet(k) { const d = await idb(); return new Promise((res, rej) => { const q = d.transaction('kv').objectStore('kv').get(k); q.onsuccess = () => res(q.result); q.onerror = () => rej(q.error) }) }
  async function kvSet(k, v) { const d = await idb(); return new Promise((res, rej) => { const tx = d.transaction('kv', 'readwrite'); tx.objectStore('kv').put(v, k); tx.oncomplete = () => res(); tx.onerror = () => rej(tx.error) }) }
  async function kvDel(k) { const d = await idb(); return new Promise(res => { const tx = d.transaction('kv', 'readwrite'); tx.objectStore('kv').delete(k); tx.oncomplete = () => res(); tx.onerror = () => res() }) }
  /* Coffre v2 : les données sont chiffrées par une clé aléatoire (DEK) ;
     cette clé est enveloppée une fois par le code, et éventuellement une fois par l'empreinte (WebAuthn PRF). */
  let saving = Promise.resolve(), dekRaw = null;
  const rnd = n => crypto.getRandomValues(new Uint8Array(n));
  const aes = raw => crypto.subtle.importKey('raw', raw, { name: 'AES-GCM' }, false, ['encrypt', 'decrypt']);
  async function wrapWith(k, raw) { const iv = rnd(12); return { iv: b64(iv), ct: b64(await crypto.subtle.encrypt({ name: 'AES-GCM', iv }, k, raw)) } }
  async function unwrapWith(k, w) { return new Uint8Array(await crypto.subtle.decrypt({ name: 'AES-GCM', iv: unb64(w.iv) }, k, unb64(w.ct))) }
  function save() { if (!key || !st || memOnly) return saving; saving = saving.then(async () => { try { const v = await enc(st, key); const o = await kvGet('vault'); o.iv = v.iv; o.ct = v.ct; await kvSet('vault', o) } catch (e) { memOnly = true; toast(t('store_fail')) } }); return saving }
  async function hasVault() { try { return !!(await kvGet('vault')) } catch (e) { memOnly = true; return false } }
  async function codeWrap(code, raw) { const salt = rnd(16); const k = await derive(code, salt); return Object.assign({ salt: b64(salt), iter: ITER }, await wrapWith(k, raw)) }
  async function createVault(code) {
    dekRaw = rnd(32); key = await aes(dekRaw); st = { sources: {}, notes: [], v: 2 };
    if (!memOnly) { try { const v = await enc(st, key); await kvSet('vault', { v: 2, iv: v.iv, ct: v.ct, wraps: { code: await codeWrap(code, dekRaw) } }) } catch (e) { memOnly = true } }
  }
  async function openWithRaw(o, raw) { const k = await aes(raw); st = await dec(o, k); key = k; dekRaw = raw; st.sources = st.sources || {}; st.notes = st.notes || [] }
  async function openVault(code) {
    const o = await kvGet('vault');
    if (o.v !== 2) { /* ancien format : clé dérivée du code → migration */
      const k = await derive(code, unb64(o.salt), o.iter); let d; try { d = await dec(o, k) } catch (e) { return false }
      dekRaw = rnd(32); key = await aes(dekRaw); st = d; st.sources = st.sources || {}; st.notes = st.notes || [];
      const v = await enc(st, key); await kvSet('vault', { v: 2, iv: v.iv, ct: v.ct, wraps: { code: await codeWrap(code, dekRaw) } }); return true }
    try { const w = o.wraps.code; const raw = await unwrapWith(await derive(code, unb64(w.salt), w.iter), w); await openWithRaw(o, raw); return true } catch (e) { return false }
  }
  /* ---------- empreinte digitale (WebAuthn + extension PRF) ---------- */
  const bioPossible = () => !!(window.PublicKeyCredential && navigator.credentials && window.isSecureContext && window.self === window.top);
  async function prfKey(secret) { const base = await crypto.subtle.importKey('raw', secret, 'HKDF', false, ['deriveKey']); return crypto.subtle.deriveKey({ name: 'HKDF', hash: 'SHA-256', salt: new TextEncoder().encode(cfg.id + '-bio'), info: new Uint8Array() }, base, { name: 'AES-GCM', length: 256 }, false, ['encrypt', 'decrypt']) }
  async function bioGet(credId, prfSalt) {
    const a = await navigator.credentials.get({ publicKey: { challenge: rnd(32), rpId: location.hostname, allowCredentials: [{ type: 'public-key', id: unb64(credId) }], userVerification: 'required', timeout: 60000, extensions: { prf: { eval: { first: unb64(prfSalt) } } } } });
    const r = a.getClientExtensionResults()?.prf?.results?.first; if (!r) throw new Error('noprf'); return new Uint8Array(r);
  }
  async function bioEnable() {
    if (!bioPossible()) throw new Error('nobio');
    const prfSalt = rnd(32);
    const c = await navigator.credentials.create({ publicKey: { challenge: rnd(32), rp: { name: cfg.name, id: location.hostname }, user: { id: rnd(16), name: cfg.name, displayName: cfg.name }, pubKeyCredParams: [{ type: 'public-key', alg: -7 }, { type: 'public-key', alg: -257 }], authenticatorSelection: { authenticatorAttachment: 'platform', userVerification: 'required', residentKey: 'preferred' }, timeout: 60000, extensions: { prf: { eval: { first: prfSalt } } } } });
    const credId = b64(c.rawId); let secret = c.getClientExtensionResults()?.prf?.results?.first;
    if (c.getClientExtensionResults()?.prf?.enabled === false) throw new Error('noprf');
    secret = secret ? new Uint8Array(secret) : await bioGet(credId, b64(prfSalt));
    const o = await kvGet('vault'); o.wraps.bio = Object.assign({ credId, prfSalt: b64(prfSalt) }, await wrapWith(await prfKey(secret), dekRaw)); await kvSet('vault', o);
  }
  async function bioOpen() { const o = await kvGet('vault'); const w = o.wraps?.bio; const secret = await bioGet(w.credId, w.prfSalt); await openWithRaw(o, await unwrapWith(await prfKey(secret), w)) }
  async function bioDisable() { const o = await kvGet('vault'); delete o.wraps.bio; await kvSet('vault', o) }
  async function hasBio() { try { const o = await kvGet('vault'); return !!o?.wraps?.bio } catch (e) { return false } }
  function lock() { key = null; st = null; dekRaw = null; docsMem = null; cfg.onLock && cfg.onLock(); stack = []; renderLock() }
  async function wipe() { try { await kvDel('vault'); await kvDel('docs') } catch (e) { } key = null; st = null; dekRaw = null; docsMem = null; cfg.onLock && cfg.onLock(); renderLock() }

  async function renderLock(errMsg) {
    const exists = memOnly ? false : await hasVault();
    const bio = exists && bioPossible() && await hasBio();
    document.body.classList.remove('in');
    app().innerHTML = `<div class="lock">
      <img src="${cfg.logo}" alt="">
      <div><h1>${esc(cfg.name)}</h1><p class="muted" style="margin:6px 0 0">${exists ? t('lock_intro') : t('first_intro')}</p></div>
      ${cfg.langs.length > 1 ? `<div class="bar">${langBtn()}</div>` : ''}
      ${bio ? `<button class="btn pri" id="bioopen" type="button">${ICON.finger} ${t('bio_open')}</button>` : ''}
      <form id="lockf" class="sec" autocomplete="off">
        <label for="code1" class="small muted">${exists ? t('code') : t('code_new')}</label>
        <input id="code1" class="pin" type="text" inputmode="numeric" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" data-lpignore="true" data-form-type="other" required minlength="4">
        ${exists ? '' : `<label for="code2" class="small muted">${t('code_again')}</label><input id="code2" class="pin" type="text" inputmode="numeric" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" data-lpignore="true" data-form-type="other" required minlength="4">`}
        <div class="err" id="lockerr">${esc(errMsg || '')}</div>
        <button class="btn ${bio ? '' : 'pri'}" type="submit">${exists ? t('unlock') : t('create')}</button>
      </form>
      ${exists ? `<details><summary class="small muted">${t('forgot')}</summary><p class="small muted">${t('forgot_txt')}</p><button class="btn danger sm" id="wipe" type="button">${t('wipe_all')}</button></details>` : `<p class="note">${t('first_note')}</p>`}
    </div>`;

  /* ---------- mise à jour automatique : paquet chiffré publié par l'ordinateur à côté de l'application ----------
     Format MT1 : « MT1 » | sel (16) | iv (16) | données AES-256-CBC (JSON compressé gzip) | HMAC-SHA256 (32). Clés : PBKDF2-SHA256(clé de liaison, sel, 100 000) → 64 octets. */

  async function mt1Open(bb, pass) {

    const z = await crypto.subtle.decrypt({ name: 'AES-CBC', iv: bb.slice(19, 35) }, ek, bb.slice(35, bb.length - 32));

  async function mt1Enc(text, pass) {

<script>
'use strict';
/* ---------- Liturgie heute & morgen (gemeinsam mit der Startseite „Aktuell“ von 00_Start) ---------- */
/* Liturgie heute & morgen – wer hält welche Messe, Beichte, Predigt (aus dem Zelebrationsplan, Fest und Farbe aus dem Monatsplan).
   Gemeinsamer Kern für die Startseite (Aktuell) und MyWil (Natel). get(key) liefert das Objekt eines Datenbereichs. */
window.wilLitDay = window.wilLitDay || function(get, ds){
  const z = get("zelebrationsplan-wil:v1") || {}, mo = (get("wochenplan-wil-monate") || {}).days || {};
  const pad = n => String(n).padStart(2, "0");
  const D = s => { const [y, m, d] = s.split("-").map(Number); return new Date(y, m - 1, d, 12); };
  const iso = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
  const dt = D(ds), wd = dt.getDay(), ws = iso(new Date(dt.getFullYear(), dt.getMonth(), dt.getDate() - wd, 12));
  const prev = iso(new Date(dt.getFullYear(), dt.getMonth(), dt.getDate() - wd - 7, 12));
  const W = (z.weeks || {})[ws], PW = (z.weeks || {})[prev];
  const P = z.priests || [];
  const split = p => String(p || "").split(/\s*(?:\/|,|\+|&|\s-\s|\s–\s|\bund\b)\s*/).map(x => x.trim()).filter(Boolean);
  const nm = c => { const p = P.find(x => x.code === c); return p && !p.guest && p.name ? p.name : c; };
  const who = p => split(p).map(nm).join(" / ");
  const codes = p => split(p);
  const ppl = ps => ps.flatMap(split).map(c => ({ n: nm(c), c }));
  const tnum = t => { const m = String(t || "").match(/(\d{1,2})[.:](\d{2})/); return m ? (+m[1]) * 60 + (+m[2]) : 9999; };
  const M = mo[ds] || {};
  const out = { d: ds, fest: M.fest || (W && W.dayNotes ? W.dayNotes[wd] || "" : ""), farbe: M.farbe || "", klasse: M.klasse || "", items: [], infos: [], hebdo: "", hebdoCodes: [], plan: !!W };
  if (wd === 0 && W && W.sundayName && !M.fest) out.fest = W.sundayName;
  if (!W) return out;
  const S = W.slots || {}, sl = k => S[k];
  if (S.h && S.h.p) { out.hebdo = who(S.h.p); out.hebdoCodes = codes(S.h.p); }
  if (wd === 0) {
    (W.blocks || []).forEach(b => {
      const roles = [];
      (b.roles || []).forEach(r => {
        const ks = Object.keys(S).filter(k => k === `s|${b.id}|${r.id}` || k.startsWith(`s|${b.id}|${r.id}#`)).sort();
        const ps = ks.map(k => S[k] && S[k].p).filter(Boolean);
        if (ps.length) roles.push({ label: r.label, who: ps.map(who).join(" · "), codes: ps.flatMap(codes), people: ppl(ps) });
      });
      if (roles.length) { const t = (W.btime || {})[b.id] || b.time; out.items.push({ time: t, title: b.title, roles, sort: tnum(t) }); }
    });
    (W.extras || []).forEach(x => { const s = sl(`x|${x.id}`); if (s && s.p) { const t = s.time || x.time; out.items.push({ time: t, title: x.label, note: s.note || "", roles: [{ label: "", who: who(s.p), codes: codes(s.p), people: ppl([s.p]) }], sort: tnum(t) }); } });
  } else {
    const rows = W.rows || [];
    rows.filter(r => !r.sub).forEach(r => {
      const s = sl(`w|${r.id}|${wd}`), sub = rows.find(x => x.sub && x.parent === r.id), bs = sub && sl(`w|${sub.id}|${wd}`);
      if (!(s && s.p) && !(bs && bs.p)) return;
      const isA = /andacht|vesper/i.test(r.label);
      const title = isA ? ((s && s.note) || "Andacht") : (r.loc ? `Hl. Messe – ${r.label}` : r.label);
      const t = (s && s.time) || r.time;
      const roles = [];
      if (s && s.p) roles.push({ label: isA ? "" : "Zelebrant", who: who(s.p), codes: codes(s.p), people: ppl([s.p]) });
      if (bs && bs.p) { const own = /[–-]/.test(bs.time || ""); roles.push({ label: own ? `Beichte ${bs.time}` : (isA ? "Beichte während der Andacht" : "Beichte"), who: who(bs.p), codes: codes(bs.p), people: ppl([bs.p]) }); }
      const note = s && !isA ? (s.note || "") : "";
      if (!(s && s.p)) roles[0].label = "";
      out.items.push({ time: (s && s.p) ? t : ((bs && bs.time) || t), title: (s && s.p) ? title : "Beichte", note, roles, sort: tnum((s && s.p) ? t : ((bs && bs.time) || t)) });
    });
  }
  out.items.sort((a, b) => a.sort - b.sort);
  (W.infos || []).filter(i => +i.day === wd && i.t).forEach(i => out.infos.push({ time: i.time || "", t: i.t, k: i.k }));
  if (wd === 0 && PW) (PW.infos || []).filter(i => +i.day === 7 && i.t).forEach(i => { if (!out.infos.some(o => o.t === i.t)) out.infos.push({ time: i.time || "", t: i.t, k: i.k }); });
  return out;
};
/* Darstellung (zweisprachig). opt: {lang:"de"|"fr", me:["PTF"], labels:[["Heute","Aujourd’hui"],["Morgen","Demain"]]} */
window.wilLitHTML = window.wilLitHTML || function(days, opt){
  opt = opt || {}; const fr = opt.lang === "fr", L = (de, f) => fr ? f : de, me = new Set(opt.me || []);
  const E = s => String(s == null ? "" : s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
  const COL = { Weiss: "#efe9da", Rot: "#a3262e", "Grün": "#3e7b4a", Violett: "#5b3a78", Schwarz: "#1e1a1b", Rosa: "#d99aae", Gold: "#c9a24a" };
  const COLFR = { Weiss: "blanc", Rot: "rouge", "Grün": "vert", Violett: "violet", Schwarz: "noir", Rosa: "rose", Gold: "or" };
  const TT = { "Hl. Messe": "Messe", "Frühmesse": "Première messe", "Amt": "Grand-messe", "Abendmesse": "Messe du soir", "Andacht": "Dévotion", "Beichte": "Confessions", "Vesper & Andacht": "Vêpres et dévotion", "Singmesse": "messe chantée", "Zelebrant": "Célébrant", "Lesung, Predigt": "Lecture, sermon", "Kommunion": "Communion", "Beichte Messe": "Confessions pendant la messe", "Beichte während der Andacht": "Confessions pendant la dévotion", "Rosenkranz": "Chapelet" };
  const tr = s => { if (!fr || !s) return s; if (TT[s]) return TT[s]; let m;
    if ((m = s.match(/^Beichte (.+)$/))) return "Confessions " + m[1];
    if ((m = s.match(/^Hl\. Messe – (.+)$/))) return "Messe – " + m[1];
    return s; };
  const WD = fr ? ["dim.", "lun.", "mar.", "mer.", "jeu.", "ven.", "sam."] : ["So", "Mo", "Di", "Mi", "Do", "Fr", "Sa"];
  const dlab = ds => { const [y, m, d] = ds.split("-").map(Number); return `${WD[new Date(y, m - 1, d, 12).getDay()]} ${d}.${m}.`; };
  const card = (D, i) => {
    const lab = (opt.labels && opt.labels[i]) ? L(opt.labels[i][0], opt.labels[i][1]) : "";
    const mine = D.items.filter(it => it.roles.some(r => r.codes.some(c => me.has(c)))).length;
    return `<div class="l2-day">
      <div class="l2-h"><span class="l2-lab">${E(lab)} · ${E(dlab(D.d))}</span>${mine ? `<span class="l2-mine" title="${L("Eigene Dienste", "Mes services")}">${L("für mich", "pour moi")}: ${mine}</span>` : ""}</div>
      <div class="l2-fest">${D.farbe ? `<span class="l2-dot" style="background:${COL[D.farbe] || "transparent"}" title="${E(fr ? COLFR[D.farbe] || D.farbe : D.farbe)}"></span>` : ""}<span>${E(D.fest || "—")}</span>${D.klasse ? ` <small>${E(D.klasse)} ${L("Kl.", "cl.")}</small>` : ""}</div>
      ${D.items.length ? `<ul class="l2-list">${D.items.map(it => { const m = it.roles.some(r => r.codes.some(c => me.has(c)));
        return `<li class="${m ? "l2-my" : ""}"><span class="l2-t">${E(it.time || "")}</span><div class="l2-x"><div class="l2-ti">${E(tr(it.title))}${it.note ? ` <small>· ${E(tr(it.note))}</small>` : ""}</div>${it.roles.map(r => `<div class="l2-r">${r.label ? `<span>${E(tr(r.label))}</span> ` : ""}${r.people.map(p => `<b${me.has(p.c) ? ' class="l2-me"' : ""}>${E(tr(p.n))}</b>`).join(" · ")}</div>`).join("")}</div></li>`; }).join("")}</ul>`
        : `<p class="l2-empty">${D.plan ? L("Im Zelebrationsplan ist für diesen Tag nichts eingetragen.", "Rien d’inscrit pour ce jour dans le plan des célébrations.") : L("Für diese Woche gibt es noch keinen Zelebrationsplan.", "Pas encore de plan des célébrations pour cette semaine.")}</p>`}
      ${D.infos.length ? `<div class="l2-inf">${D.infos.map(x => `<div>${x.time ? `<b>${E(x.time)}</b> ` : ""}${E(x.t)}</div>`).join("")}</div>` : ""}
      ${D.hebdo ? `<div class="l2-heb">${L("Hebdomadar der Woche", "Hebdomadier de la semaine")}: <b${D.hebdoCodes.some(c => me.has(c)) ? ' class="l2-me"' : ""}>${E(D.hebdo)}</b></div>` : ""}
    </div>`; };
  return `<div class="l2-days">${days.map(card).join("")}</div>`;
};

  const TOFF = { ascher: -46, septuag: -63, laetare: -21, passion: -14, mitleiden: -9, palm: -7, gruendo: -3, karfr: -2, karsa: -1, vigil: -1, ostern: 0, ostermo: 1, oktav: 1, weisser: 7, bitt: 36, himmelf: 39, pfingst: 49, pfingstmo: 50, dreif: 56, fronl: 60, herzjesu: 68 };

  /* prochaine date (aujourd'hui compris) d'une occasion du coutumier, ou null */
  function lfNext(k, a) {

    const nthWd = (y, m, wdN, n) => { const d = new Date(y, m - 1, 1); while (d.getDay() !== wdN) d.setDate(d.getDate() + 1); d.setDate(d.getDate() + 7 * (n - 1)); return isoD(d) };

  const docCard = ({ d, i }) => { const nd = d.date ? diffDays(d.date.slice(0, 10), today()) : 99;
    return `<button class="dcard" style="--c:${DCOL[d.grp] || 'var(--accent)'}" data-a="go" data-v="plan" data-arg="${i}"><span class="di" aria-hidden="true">${DICON[d.grp] || '📄'}</span><b>${esc(t('g_' + d.grp))}</b><small>${esc(t('updated', { d: fmtD((d.date || '').slice(0, 10)) }))}</small>${nd <= 2 ? `<span class="chip ok">${t('new')}</span>` : ''}</button>` };
  if (!document.getElementById('wil-home-css')) { const st = document.createElement('style'); st.id = 'wil-home-css'; st.textContent = `
    .dcards{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
    .dcard{position:relative;display:flex;flex-direction:column;align-items:flex-start;gap:3px;text-align:left;min-height:104px;padding:12px 12px 12px 14px;border:1px solid var(--line);border-top:4px solid var(--c);border-radius:14px;background:var(--surface);color:var(--ink);font:inherit;cursor:pointer;box-shadow:0 1px 2px rgba(0,0,0,.05)}
    .dcard:last-child:nth-child(odd){grid-column:1/-1;min-height:0}.dcard:active{transform:scale(.98)}.dcard .di{font-size:24px;line-height:1}.dcard b{font-size:15px;line-height:1.25;margin-top:4px}.dcard small{color:var(--muted);font-size:12.5px}.dcard .chip{position:absolute;top:10px;right:10px}
    .bref{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
    .bt{display:flex;flex-direction:column;align-items:center;gap:2px;padding:10px 4px;border:1px solid var(--line);border-radius:14px;background:var(--surface);color:var(--ink);font:inherit;cursor:pointer}
    .bt svg{width:20px;height:20px;color:var(--accent)}.bt b{font-size:20px;line-height:1.1}.bt small{font-size:11.5px;color:var(--muted);text-align:center;line-height:1.2}`; document.head.appendChild(st) }
  const docOrder = D => D.map((d, i) => ({ d, i })).sort((a, b) => (GRP.indexOf(a.d.grp) - GRP.indexOf(b.d.grp)) || (a.d.draft - b.d.draft));
  const docRow = ({ d, i }) => `<button class="row" data-a="go" data-v="plan" data-arg="${i}"><div class="m"><b>${esc(t('g_' + d.grp))}</b><small>${d.draft ? t('draft') : t('published')} · ${esc(t('updated', { d: fmtD((d.date || '').slice(0, 10)) }))}</small></div><div class="s"><span class="chip ${d.draft ? 'amber' : 'ok'}">${d.draft ? t('draft').split(' ')[0] : 'PDF'}</span></div></button>`;
  function vPlans() { return `<h1>${t('plans')}</h1><div class="list" id="planlist"><div class="empty">${t('working')}</div></div>` }
  function vPlan(i) { return `<h1 id="plantitle">${t('plans')}</h1><div id="pdfview" class="sec"></div>` }
  async function after(n, a) {
    if (n === 'plans' || n === 'home') {
      const el = document.getElementById(n === 'plans' ? 'planlist' : 'homeplans'); if (!el) return;
      const D = await M.getDocs(); if (!D.length) { el.innerHTML = `<div class="empty">${t('no_plans')}</div>`; return }
      let rows = docOrder(D); if (n === 'home') { rows = rows.filter(o => !o.d.draft); el.innerHTML = rows.map(docCard).join(''); return }
      el.innerHTML = rows.map(docRow).join('');
    }
    if (n === 'plan') { const D = await M.getDocs(); const d = D[+a]; if (!d) return; document.getElementById('plantitle').textContent = t('g_' + d.grp) + (d.draft ? ' – ' + t('draft') : ''); M.renderPdf(d.b64, document.getElementById('pdfview')) }
  }

  function vMore() {
    const tile = (v, icon, label, sub) => `<button class="tile" data-a="go" data-v="${v}">${ICON[icon]}<b>${t(label)}</b>${sub ? `<small>${sub}</small>` : ''}</button>`;
    return `<h1>${t('more')}</h1><div class="grid">
      ${tile('plans', 'note', 'plans')}${has.defunts() ? tile('defunts', 'cross', 'defunts') : ''}${has.affaires() ? tile('affaires', 'check', 'matters', String(openTodos().length + openTr().length)) : ''}${has.groupes() ? tile('groupes', 'group', 'groups') : ''}${has.coutumier() ? tile('coutumier', 'book', 'coutumier') : ''}${tile('hotes', 'bed', 'hotes')}${has.vehicules() ? tile('vehicules', 'car', 'vehicules') : ''}${tile('dossiers', 'folder', 'dossiers')}${tile('donnees', 'data', 'data')}</div>`;
  }

  /* ---------- démarrage ---------- */
  /* (2026-11-09) Porte d'entrée / Eingangstür : sans lien personnel valable, rien d'autre que cette page.
     La clé est vraiment vérifiée (ouverture du petit fichier chiffré de la personne). Retiré ou remplacé -> la porte reste fermée. */
  const TOR = 'mywil-tor';
  async function torHex(k) { return Array.from(new Uint8Array(await crypto.subtle.digest('SHA-256', new TextEncoder().encode(k)))).map(x => x.toString(16).padStart(2, '0')).join('').slice(0, 20) }
  async function torCheck(b, k) {
    if (b.length < 100 || String.fromCharCode(b[0], b[1], b[2]) !== 'MT1') return false;
    const base = await crypto.subtle.importKey('raw', new TextEncoder().encode(k), 'PBKDF2', false, ['deriveBits']);
    const km = new Uint8Array(await crypto.subtle.deriveBits({ name: 'PBKDF2', salt: b.slice(3, 19), iterations: 100000, hash: 'SHA-256' }, base, 512));
    const mk = await crypto.subtle.importKey('raw', km.slice(32), { name: 'HMAC', hash: 'SHA-256' }, false, ['verify']);
    return crypto.subtle.verify('HMAC', mk, b.slice(b.length - 32), b.slice(0, b.length - 32));
  }
  async function torVault() { /* nur ein wirklich eingerichtetes Handy (Tresor vorhanden) darf ohne Link herein */
    try { if (!indexedDB.databases) return false; const L = await indexedDB.databases(); if (!L.some(d => d && d.name === 'natel-mywil')) return false;
      return await new Promise(res => { const r = indexedDB.open('natel-mywil'); r.onupgradeneeded = () => { try { r.transaction.abort() } catch (e) { } res(false) };
        r.onerror = () => res(false); r.onsuccess = () => { const db = r.result; try { if (!db.objectStoreNames.contains('kv')) { db.close(); return res(false) } const q = db.transaction('kv').objectStore('kv').get('vault'); q.onsuccess = () => { db.close(); res(!!(q.result && q.result.ct)) }; q.onerror = () => { db.close(); res(false) } } catch (e) { try { db.close() } catch (e2) { } res(false) } } }) } catch (e) { } return false }
  function torDoor(why) {
    const de = { none: 'Diese Seite ist nur für Mitglieder mit einem persönlichen Link zugänglich.', bad: 'Dieser Link ist nicht (mehr) gültig.', gone: 'Ihr Zugang wurde beendet oder durch einen neuen Link ersetzt.', net: 'Keine Internetverbindung – zum ersten Öffnen braucht es Internet.' }[why];
    const fr = { none: 'Cette page n’est accessible qu’aux membres disposant d’un lien personnel.', bad: 'Ce lien n’est pas (ou plus) valable.', gone: 'Votre accès a été retiré ou remplacé par un nouveau lien.', net: 'Pas de connexion Internet – la première ouverture en a besoin.' }[why];
    const more = why === 'none' ? '' : `<p style="margin:14px 0 0;color:#5b6a60">Bitte beim Prior einen neuen Link verlangen.<br>Merci de demander un nouveau lien au prieur.</p>`;
    document.title = 'Sancta Maria Wil';
    document.getElementById('app').innerHTML = `<div style="min-height:100vh;display:grid;place-items:center;padding:24px;box-sizing:border-box;background:#f3f5f1;font:16px/1.5 system-ui,'Segoe UI',sans-serif;color:#1d2a22">
      <div style="max-width:440px;text-align:center"><div style="font:600 22px Georgia,serif;color:#1f5230;margin-bottom:4px">Sancta Maria Wil</div>
      <div style="font-size:13px;letter-spacing:.12em;text-transform:uppercase;color:#7a857c;margin-bottom:18px">Interner Zugang · Accès interne</div>
      <p style="margin:0 0 8px">${de}</p><p style="margin:0;color:#3d4a41">${fr}</p>${more}</div></div>`;
    return false;
  }
  async function torOpen() {
    let flag = null; try { flag = localStorage.getItem(TOR) } catch (e) { }
    const m = location.hash.match(/lien=([A-Za-z0-9-]{24,40})/);
    if (m) {
      const k = m[1].toUpperCase().replace(/[^A-Z0-9]/g, ''), z = await torHex(k);
      let r; try { r = await fetch('z-' + z + '.bin?t=' + Date.now(), { cache: 'no-store' }) } catch (e) { return torDoor('net') }
      if (r.ok && await torCheck(new Uint8Array(await r.arrayBuffer()), k)) { try { localStorage.setItem(TOR, z) } catch (e) { } return true }
      try { history.replaceState(null, '', location.pathname) } catch (e) { }
      return torDoor('bad');
    }
    if (flag) {
      try { const r = await fetch('z-' + flag + '.bin?t=' + Date.now(), { cache: 'no-store', method: 'HEAD' }); if (r.status === 404) { try { localStorage.removeItem(TOR) } catch (e) { } return torDoor('gone') } } catch (e) { /* hors ligne : on laisse entrer */ }
      return true;
    }
    if (await torVault()) return true;   /* Natel déjà relié avant la porte */
    return torDoor('none');
  }
  torOpen().then(ok => { if (!ok) return;
  M.init({
    bundle: 'MyWil-Natel.json', autoSync: 'wil-direction.bin', autoSyncAlt: ['wil-pretres.bin', 'wil-secretariat.bin', 'wil-lien.bin'], askWho: true, zugang: true, manualTxt: 'update_txt_wil', notesRepo: (function () { const m = location.hostname.match(/^([^.]+)\.github\.io$/i); return m ? m[1] + '/' + location.hostname.toLowerCase() : '' })(), id: 'mywil', name: 'MyWil', langs: ['fr', 'de'], T, logo: window.LOGO,
    sources: [{ key: 'wil', label: 'src_wil', where: 'src_wil_where' }, { key: 'prio', label: 'src_prio', where: 'src_prio_where' }, { key: 'lsa', label: 'src_lsa', where: 'src_lsa_where' }],
    detect, onLock() { lsa = null }, onImport() { lsa = null },
    freshness() { const lv = levelTxt(); const pre = lv ? esc(lv) + ' · ' : ''; const sa = M.st && (M.st.syncMade || M.st.syncAt); if (sa) { const d = new Date(sa); return pre + esc((diffDays(isoD(d), today()) === 0) ? t('fresh_today', { h: d.toTimeString().slice(0, 5) }) : t('fresh_at', { d: fmtD(isoD(d)), h: d.toTimeString().slice(0, 5) })) } const i = srcInfo('wil'); return i ? esc(t('data_of', { d: fmtD((i.data.erstellt || i.fileDate || i.importedAt).slice(0, 10)) })) : esc(t('app_sub')) },
    tabs: [{ v: 'home', icon: 'home', label: 'home' }, { v: 'agenda', icon: 'cal', label: 'agenda' }, { v: 'fideles', icon: 'people', label: 'fideles' }, { v: 'notes', icon: 'note', label: 'notes' }, { v: 'more', icon: 'more', label: 'more' }],
    tabOf: { person: 'fideles', household: 'fideles', plans: 'home', plan: 'home' },
    noteDomains: { fideles: 'nd_fideles', agenda: 'nd_agenda', matters: 'nd_matters', groups: 'nd_groups', house: 'nd_house', other: 'nd_other' },
    after, views: { plans: vPlans, plan: vPlan, home: vHome, agenda: vAgenda, fideles: vFideles, person: vPerson, household: vHousehold, defunts: vDefunts, affaires: vAffaires, groupes: vGroupes, coutumier: vCoutumier, hotes: vHotes, vehicules: vVehicules, more: vMore },
    actions: {
      agjump(el) { const d = el.dataset.d; document.querySelectorAll('.ags').forEach(b => b.classList.toggle('on', b === el)); const r = [...document.querySelectorAll('.row[id^="ag-"]')].find(x => x.id.slice(3) >= d); if (r) r.scrollIntoView({ behavior: 'smooth', block: 'start' }) },
      async lsaopen() { const pw = document.getElementById('lsapw').value, err = document.getElementById('lsaerr'); if (!pw) return; err.textContent = t('working');
        try { const d = await lsaUnlock(src('lsa'), pw); if (!d) { err.textContent = t('lsa_wrong'); return } lsa = d; render() } catch (e) { err.textContent = t('lsa_wrong') } }
    }
  });
  });
  document.addEventListener('keydown', e => { if (e.key === 'Enter' && e.target.id === 'lsapw') { e.preventDefault(); document.querySelector('[data-a="lsaopen"]')?.click() } });
})();
